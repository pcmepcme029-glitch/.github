name: Sync Discord Sub Roles to Supabase

on:
  schedule:
    - cron: '0 * * * *' # සෑම පැයකටම වරක් (Every 1 hour) Auto Run වේ
  workflow_dispatch: # ඕනෑම වෙලාවක Manual Run කර බලන්න

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests supabase

      - name: Execute Role Sync Script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_roles.py
